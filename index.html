<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>★イラスト置き場★</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DotGothic16', 'Zen Maru Gothic', sans-serif;
      background-color: #f3e8ff;
      background-image: 
        radial-gradient(circle at 20% 30%, #ffd6e7 2px, transparent 2px),
        radial-gradient(circle at 80% 70%, #c8f0ff 2px, transparent 2px),
        radial-gradient(circle at 50% 50%, #e8d5ff 1.5px, transparent 1.5px);
      background-size: 50px 50px, 70px 70px, 40px 40px;
      color: #5a4a6a;
      min-height: 100vh;
      text-align: center;
    }

    /* ヘッダー */
    .header {
      background: linear-gradient(90deg, #ffd6e7, #d6f0ff, #e8d5ff, #ffd6e7);
      padding: 6px;
      border-bottom: 4px solid #e0b0d0;
    }

    .header-inner {
      background: #fff9fc;
      padding: 18px 12px;
      border: 3px solid #f0c0d8;
    }

    h1 {
      font-size: 2.4rem;
      color: #d48bb8;
      text-shadow: 1px 1px 0 #fff;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .marquee-box {
      background: #fff;
      border: 2px solid #e0c0e8;
      margin: 12px auto;
      max-width: 880px;
      padding: 5px;
    }

    marquee {
      color: #9b7bb8;
      font-size: 1.05rem;
    }

    .blink {
      animation: blink 1.6s step-end infinite;
      color: #c89bc8;
      font-weight: bold;
    }

    @keyframes blink {
      50% { opacity: 0.3; }
    }

    .counter {
      display: inline-block;
      background: #fff;
      border: 2px solid #d0b0d8;
      padding: 3px 10px;
      margin: 10px 0;
      font-family: monospace;
      font-size: 1.2rem;
      color: #8a6a9a;
      letter-spacing: 2px;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 22px;
      padding: 30px 20px 50px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      width: 250px;
      background: #fff;
      border: 3px solid #e8c0d8;
      box-shadow: 4px 4px 0 #e0d0e8;
      transition: 0.2s;
      cursor: pointer;
      border-radius: 6px;
    }

    .card:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #e0d0e8;
      border-color: #d8a0c0;
    }

    .card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-bottom: 2px solid #e8c0d8;
      display: block;
      border-radius: 3px 3px 0 0;
    }

    .card-info {
      padding: 10px;
      background: #fff9fc;
    }

    .card-info h3 {
      color: #c070a0;
      font-size: 1.05rem;
      margin-bottom: 3px;
    }

    .card-info p {
      color: #9a7aa8;
      font-size: 0.9rem;
    }

    /* ライトボックス */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(80, 60, 90, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 92%;
      max-height: 88vh;
      border: 4px solid #e0b0d0;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(200, 150, 180, 0.4);
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 25px;
      font-size: 2.8rem;
      color: #f0d0e0;
      cursor: pointer;
      font-weight: bold;
    }

    .close-btn:hover {
      color: #fff;
    }

    footer {
      background: #f8f0f8;
      border-top: 3px solid #e0c0e0;
      padding: 16px;
      color: #9a7aa8;
      font-size: 0.95rem;
    }

    .footer-links {
      margin-top: 8px;
    }

    .footer-links a {
      color: #c070a0;
      margin: 0 10px;
      text-decoration: none;
    }

    .footer-links a:hover {
      color: #a05080;
      text-decoration: underline;
    }

    hr.pastel {
      border: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #e8c0d8, #c0e0f0, #e0d0f0, #e8c0d8, transparent);
      margin: 15px auto;
      width: 80%;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.7rem; }
      .card { width: 90%; max-width: 300px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-inner">
      <h1>★ ネオン電波ギャラリー ★</h1>
      <div class="blink">☆☆ ようこそ！私の電波イラスト置き場へ ☆☆</div>
      
      <div class="marquee-box">
        <marquee behavior="scroll" scrollamount="5">
          ★ パステルカラーの電波イラストギャラリーです ★ ゆっくりしていってね ★
        </marquee>
      </div>

      <div>
        あなたは <span class="counter" id="counter">00013847</span> 人目の訪問者です
      </div>
    </div>
  </div>

  <hr class="pastel">

  <div class="gallery" id="gallery">
    <!-- カードここから -->
    <div class="card" onclick="openLightbox(this)">
      <img src="https://picsum.photos/id/1015/600/600" alt="イラスト1">
      <div class="card-info">
        <h3>タイトル例1</h3>
        <p>2025.11</p>
      </div>
    </div>

    <div class="card" onclick="openLightbox(this)">
      <img src="https://picsum.photos/id/1025/600/600" alt="イラスト2">
      <div class="card-info">
        <h3>タイトル例2</h3>
        <p>2025.10</p>
      </div>
    </div>

    <div class="card" onclick="openLightbox(this)">
      <img src="https://picsum.photos/id/1035/600/600" alt="イラスト3">
      <div class="card-info">
        <h3>タイトル例3</h3>
        <p>2025.09</p>
      </div>
    </div>

    <div class="card" onclick="openLightbox(this)">
      <img src="https://picsum.photos/id/1045/600/600" alt="イラスト4">
      <div class="card-info">
        <h3>タイトル例4</h3>
        <p>2025.08</p>
      </div>
    </div>
    <!-- カードここまで -->
  </div>

  <hr class="pastel">

  <footer>
    <div>★ Last Updated: 2025.11.14 ★</div>
    <div class="footer-links">
      <a href="mailto:your@email.com">メールはこちら</a> |
      <a href="#">ホーム</a> |
      <a href="#">リンク集</a>
    </div>
    <div style="margin-top:8px; font-size:0.85rem; color:#b0a0b8;">
      Best viewed with nostalgia
    </div>
  </footer>

  <!-- ライトボックス -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="close-btn">×</span>
    <img id="lightbox-img" src="" alt="拡大">
  </div>

  <script>
    const counter = document.getElementById('counter');
    let num = parseInt(localStorage.getItem('denpa_count') || '13847');
    num++;
    localStorage.setItem('denpa_count', num);
    counter.textContent = String(num).padStart(8, '0');

    function openLightbox(card) {
      const imgSrc = card.querySelector('img').src;
      document.getElementById('lightbox-img').src = imgSrc;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
